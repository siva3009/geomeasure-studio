services:
  - type: web
    name: geomeasure-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_IN_MEMORY_DB
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_DECOMPRESSED_SIZE_MB
        value: "200"

