services:
  - type: web
    name: geomeasure-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_IN_MEMORY_DB
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://geomeasure-studio.vercel.app"
      - key: SUPABASE_URL
        value: "https://egvoacfdtynoafsqlmol.supabase.co"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_DECOMPRESSED_SIZE_MB
        value: "200"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: GROQ_BASE_URL
        value: "https://api.groq.com/openai/v1"

